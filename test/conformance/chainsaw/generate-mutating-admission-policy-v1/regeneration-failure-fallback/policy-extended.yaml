apiVersion: policies.kyverno.io/v1beta1
kind: MutatingPolicy
metadata:
  name: map-regeneration-failure-fallback
spec:
  autogen:
    mutatingAdmissionPolicy:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups: [ "apps" ]
      apiVersions: [ "v1" ]
      operations: [ "CREATE" ]
      resources: [ "deployments" ]
  matchConditions:
  # same name as the exception's matchCondition, so the generated MutatingAdmissionPolicy is invalid
  - name: shared-name
    expression: "true"
  mutations:
  - patchType: JSONPatch
    jsonPatch:
      expression: |
        has(object.metadata.labels) ?
        [
          JSONPatch{op: "add", path: "/metadata/labels/managed", value: "true"},
          JSONPatch{op: "add", path: "/metadata/labels/team", value: "platform"}
        ] :
        [
          JSONPatch{op: "add", path: "/metadata/labels", value: {"managed": "true", "team": "platform"}}
        ]
